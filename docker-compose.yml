version: '3.8'

services:
  # API Servisi
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CleanArchDb;Username=postgres;Password=YourStrongPassword!
      # TokenOptions ve Google/Apple Auth client id'leri buraya eklenebilir
    depends_on:
      - db
      - redis

  # PostgreSQL Veritabanı Servisi (Opsiyonel / Template)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrongPassword!
      - POSTGRES_DB=CleanArchDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis Servisi (Distributed Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
